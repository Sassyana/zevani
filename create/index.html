<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVANI — Create Your Companion</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="../index-current.html" title="ZEVANI Companion Builder"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const ids=['homePage','authPage','dashboardPage','chatPage'];ids.forEach(id=>{const e=d.getElementById(id);if(e)e.classList.add('hidden')});const b=d.getElementById('builderPage');if(b)b.classList.remove('hidden');const logo=d.getElementById('logoHome');if(logo)logo.onclick=()=>{location.href='../'};const home=d.getElementById('homeLink');if(home)home.onclick=e=>{e.preventDefault();location.href='../'};const back=d.getElementById('authBack');if(back)back.onclick=()=>{location.href='../'};d.title='ZEVANI — Create Your Companion';}catch(e){console.error(e)}});</script></body></html>
