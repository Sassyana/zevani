name: ZEVANI Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reliable login handler in app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index-current.html')
          s = p.read_text()
          marker = 'ZEVANI LOGIN HANDLER V3'
          if marker in s:
              print('Login handler already installed')
              raise SystemExit(0)
          if '</body>' not in s:
              raise SystemExit('index-current.html body marker not found')
          script = r'''<script>
          /* ZEVANI LOGIN HANDLER V3 */
          (function(){
            const SUPABASE_URL='https://hfdembdqzsedjbgemtdp.supabase.co';
            const SUPABASE_KEY='sb_publishable_NZAxQrtZ-sssoeIGVySf3w_1c0Io_xu';
            function client(){
              if(!window.supabase || typeof window.supabase.createClient!=='function') return null;
              if(!window.zevaniLoginClient) window.zevaniLoginClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
              return window.zevaniLoginClient;
            }
            function pages(){return ['homePage','betaPage','builderPage','profilePage','chatPage','authPage','zevaniDashboard'];}
            function hideAll(){pages().forEach(id=>{const e=document.getElementById(id);if(e){e.classList.add('hidden');e.classList.remove('active')}})}
            function setText(id,text){const e=document.getElementById(id);if(e)e.textContent=text}
            function setMode(mode){
              window.zevaniAuthMode=mode;
              const register=mode==='register';
              setText('authLabel',register?'CREATE YOUR ACCOUNT':'LOG IN');
              setText('authTitle',register?'Join ZEVANI.':'Welcome back.');
              setText('authText',register?'Create your private member account and save your ZEVANI companion.':'Log in to continue to your ZEVANI account.');
              const name=document.getElementById('authName'), confirm=document.getElementById('authPasswordConfirm');
              if(name)name.style.display=register?'block':'none';
              if(confirm)confirm.style.display=register?'block':'none';
              const pass=document.getElementById('authPassword');if(pass)pass.autocomplete=register?'new-password':'current-password';
              setText('authSubmitText',register?'Create Account':'Log In');
              setText('authSwitchText',register?'Already have an account?':'Don\'t have an account yet?');
              setText('authSwitchButton',register?'Log in':'Create one');
            }
            function clearMessages(){['authError','authSuccess'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent='';e.style.display='none'}})}
            function openAuth(mode){
              hideAll();
              const auth=document.getElementById('authPage');
              if(!auth)return;
              auth.classList.remove('hidden');
              setMode(mode||'register');
              clearMessages();
              window.scrollTo(0,0);
            }
            window.showAuth=function(mode){openAuth(mode||'register')};
            window.toggleAuthMode=function(){openAuth(window.zevaniAuthMode==='register'?'login':'register')};
            window.handleAuthSubmit=async function(event){
              event.preventDefault();
              clearMessages();
              const email=(document.getElementById('authEmail')||{}).value?.trim()||'';
              const password=(document.getElementById('authPassword')||{}).value||'';
              const name=(document.getElementById('authName')||{}).value?.trim()||'';
              const confirm=(document.getElementById('authPasswordConfirm')||{}).value||'';
              const button=document.getElementById('authSubmit');
              const sb=client();
              if(!sb){const e=document.getElementById('authError');if(e){e.textContent='Login service is still loading. Please try again.';e.style.display='block'}return}
              if(window.zevaniAuthMode==='register' && password!==confirm){const e=document.getElementById('authError');if(e){e.textContent='Your passwords do not match.';e.style.display='block'}return}
              if(button)button.disabled=true;
              try{
                let result;
                if(window.zevaniAuthMode==='register'){
                  result=await sb.auth.signUp({email,password,options:{data:{name:name||email.split('@')[0]},emailRedirectTo:location.href}});
                }else{
                  result=await sb.auth.signInWithPassword({email,password});
                }
                if(result.error)throw result.error;
                if(window.zevaniAuthMode==='register' && !result.data.session){
                  const ok=document.getElementById('authSuccess');if(ok){ok.textContent='Account created! Check your email, verify it, then log in.';ok.style.display='block'}
                  return;
                }
                const user=result.data.user;
                if(user){localStorage.setItem('zevaniUserEmail',user.email||'');localStorage.setItem('zevaniUserName',(user.user_metadata&&user.user_metadata.name)||((user.email||'').split('@')[0]));}
                if(typeof window.openZevaniDashboard==='function')window.openZevaniDashboard();
                else if(typeof window.openDashboard==='function')window.openDashboard();
                else {hideAll();const dash=document.getElementById('zevaniDashboard');if(dash){dash.classList.remove('hidden');dash.classList.add('active')}}
              }catch(err){const e=document.getElementById('authError');if(e){e.textContent=err.message||'Login failed. Please check your email and password.';e.style.display='block'}}
              finally{if(button)button.disabled=false}
            };
            function wire(){
              const form=document.getElementById('authForm');
              if(form)form.onsubmit=window.handleAuthSubmit;
              document.querySelectorAll('button,a').forEach(el=>{
                if(el.dataset.zevaniLoginWired)return;
                const text=(el.textContent||'').trim();
                if(/^log\s*in$/i.test(text)){
                  el.dataset.zevaniLoginWired='1';
                  el.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();openAuth('login')},true);
                }
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);else wire();
            setTimeout(wire,250);setTimeout(wire,1000);
          })();
          </script>'''
          s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-current.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ZEVANI login inside app'
          git push
