name: ZEVANI Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'ZEVANI LOGIN BRIDGE V2' in s:
              print('Login bridge already installed')
              raise SystemExit(0)
          marker = "  frame.addEventListener('load',function(){"
          if marker not in s:
              raise SystemExit('index.html load marker not found')
          bridge = r'''  /* ZEVANI LOGIN BRIDGE V2 */
  function installLoginBridge(){
    let w,d;
    try{w=frame.contentWindow;d=frame.contentDocument}catch(e){return}
    if(!w||!d||!d.body||d.getElementById('zevaniLoginOverlay'))return;
    const sb=w.supabase;
    if(!sb||typeof sb.createClient!=='function')return;
    const client=sb.createClient('https://hfdembdqzsedjbgemtdp.supabase.co','sb_publishable_NZAxQrtZ-sssoeIGVySf3w_1c0Io_xu');
    const overlay=d.createElement('div');
    overlay.id='zevaniLoginOverlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:999999;background:#f7f4ed;display:none;align-items:center;justify-content:center;padding:30px;box-sizing:border-box;overflow:auto';
    overlay.innerHTML='<div style="width:100%;max-width:520px;background:white;border:1px solid #e4dfd5;border-radius:30px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,.1);box-sizing:border-box"><div style="color:#c7a86b;text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:bold">ZEVANI</div><h2 style="font-family:Georgia,serif;font-size:42px;font-weight:normal;color:#101a2d;margin:12px 0">Welcome back.</h2><p style="color:#707887;line-height:1.6">Log in to continue to your ZEVANI account.</p><div id="zvLoginError" style="display:none;background:#fff0ef;color:#a94442;padding:12px;border-radius:12px;font-size:13px;margin:15px 0"></div><form id="zvLoginForm"><input id="zvLoginEmail" type="email" placeholder="Email address" autocomplete="email" required style="width:100%;padding:16px;border:1px solid #e4dfd5;border-radius:14px;font-size:15px;box-sizing:border-box;margin-bottom:12px"><input id="zvLoginPassword" type="password" placeholder="Password" autocomplete="current-password" required style="width:100%;padding:16px;border:1px solid #e4dfd5;border-radius:14px;font-size:15px;box-sizing:border-box;margin-bottom:16px"><button id="zvLoginSubmit" type="submit" style="width:100%;border:0;background:#101a2d;color:white;padding:16px;border-radius:30px;font-weight:bold;cursor:pointer">Log In</button></form><button id="zvLoginBack" type="button" style="width:100%;margin-top:12px;background:white;border:1px solid #c9c3b6;color:#101a2d;padding:14px;border-radius:30px;font-weight:bold;cursor:pointer">← Back</button></div>';
    d.body.appendChild(overlay);
    const show=()=>{overlay.style.display='flex';d.getElementById('zvLoginEmail').focus()};
    const hide=()=>{overlay.style.display='none'};
    w.showAuth=show;
    [...d.querySelectorAll('button,a')].filter(el=>/log\s*in/i.test((el.textContent||'').trim())).forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();show()},true));
    d.getElementById('zvLoginBack').onclick=hide;
    d.getElementById('zvLoginForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=d.getElementById('zvLoginSubmit'),err=d.getElementById('zvLoginError');
      err.style.display='none';btn.disabled=true;btn.textContent='Logging in…';
      try{
        const r=await client.auth.signInWithPassword({email:d.getElementById('zvLoginEmail').value.trim(),password:d.getElementById('zvLoginPassword').value});
        if(r.error)throw r.error;
        hide();
        if(r.data&&r.data.user){localStorage.setItem('zevaniUserEmail',r.data.user.email||'');localStorage.setItem('zevaniUserName',(r.data.user.user_metadata&&r.data.user.user_metadata.name)||((r.data.user.email||'').split('@')[0]))}
        if(typeof w.openDashboard==='function')w.openDashboard();
      }catch(ex){err.textContent=ex.message||'Login failed. Please check your email and password.';err.style.display='block'}
      finally{btn.disabled=false;btn.textContent='Log In'}
    };
  }
'''
          s = s.replace(marker, bridge + '\n' + marker, 1)
          s = s.replace("  frame.addEventListener('load',function(){\n    installFixes();", "  frame.addEventListener('load',function(){\n    installFixes();\n    installLoginBridge();", 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ZEVANI login flow'
          git push
