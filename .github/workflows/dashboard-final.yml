name: ZEVANI Dashboard Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Dashboard button direct and reliable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<button id="zevaniDashboardButton" class="small-button" style="margin-left:8px" onclick="openZevaniDashboard()">Dashboard</button>'
          new='<button id="zevaniDashboardButton" class="small-button" style="margin-left:8px" type="button">Dashboard</button>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'id="zevaniDashboardButton"' not in s:
              raise SystemExit('Dashboard button not found')
          marker='<script>\nfunction openZevaniDashboard(){var d=document.getElementById(\'zevaniDashboard\');if(!d)return;d.classList.add(\'active\');window.scrollTo(0,0);try{var n=localStorage.getItem(\'zevaniCompanionName\'),t=localStorage.getItem(\'zevaniCompanionType\');if(n){document.getElementById(\'zdashName\').textContent=n;document.getElementById(\'zdashAvatar\').textContent=n.charAt(0).toUpperCase()}if(t)document.getElementById(\'zdashType\').textContent=t}catch(e){}}'
          if 'data-zevani-dashboard-handler' not in s:
              handler='''<script data-zevani-dashboard-handler>\n(function(){\n  var b=document.getElementById("zevaniDashboardButton");\n  if(!b)return;\n  b.addEventListener("click",function(e){\n    e.preventDefault();\n    e.stopPropagation();\n    var d=document.getElementById("zevaniDashboard");\n    if(!d)return;\n    document.querySelectorAll("#homePage,#betaPage,#builderPage,#profilePage,#chatPage").forEach(function(x){x.classList.add("hidden")});\n    d.classList.add("active");\n    var n=localStorage.getItem("zevaniCompanionName")||"Alex";\n    var t=localStorage.getItem("zevaniCompanionType")||"Romantic";\n    var name=document.getElementById("zdashName"),type=document.getElementById("zdashType"),avatar=document.getElementById("zdashAvatar");\n    if(name)name.textContent=n;if(type)type.textContent=t;if(avatar)avatar.textContent=n.charAt(0).toUpperCase();\n    window.scrollTo(0,0);\n  });\n})();\n</script>\n'''
              s=s.replace('</body>',handler+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Dashboard button reliable'
          git push
