name: Connect ZEVANI Authentication
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Supabase browser library loads first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Supabase before authentication code"
          git push
