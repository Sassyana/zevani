name: Final ZEVANI Authentication Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync logged-in navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index-current.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ZEVANI NAV AUTH SYNC -->'
          if marker not in s:
              code = r'''<!-- ZEVANI NAV AUTH SYNC -->
<script>
(function(){
  function syncNav(){
    var guest=document.getElementById('guestAuthButtons');
    var account=document.getElementById('accountBar');
    var email=document.getElementById('accountEmail');
    var dash=document.getElementById('zevaniDashboardButton');
    var userEmail=localStorage.getItem('zevaniUserEmail')||'';
    var userName=localStorage.getItem('zevaniUserName')||'';
    var loggedIn=!!userEmail;
    if(guest) guest.style.display=loggedIn?'none':'flex';
    if(account) account.style.display=loggedIn?'flex':'none';
    if(email) email.textContent=userEmail||userName;
    if(dash) dash.style.display=loggedIn?'inline-block':'none';
  }
  syncNav();
  window.addEventListener('storage',syncNav);
  setInterval(syncNav,500);
})();
</script>
'''
              s=s.replace('</body>',code+'</body>')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate files
        run: |
          test -s index.html
          test -s index-current.html

      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-current.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix logged-in navigation state"
            git push
          fi
