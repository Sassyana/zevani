name: One-time ZEVANI login fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-login:
    if: ${{ !contains(github.event.head_commit.message, 'Apply final ZEVANI login fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch login handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index-current.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ZEVANI FINAL LOGIN FIX 2026-08-18'
          if marker in s:
              raise SystemExit(0)
          script = r'''<script>
          /* ZEVANI FINAL LOGIN FIX 2026-08-18 */
          (function(){
            const URL='https://hfdembdqzsedjbgemtdp.supabase.co';
            const KEY='sb_publishable_NZAxQrtZ-sssoeIGVySf3w_1c0Io_xu';
            function loadSupabase(){
              return new Promise((resolve,reject)=>{
                if(window.supabase && typeof window.supabase.createClient==='function') return resolve();
                const sc=document.createElement('script');
                sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                sc.onload=resolve;
                sc.onerror=()=>reject(new Error('Unable to load the login service. Please refresh the page.'));
                document.head.appendChild(sc);
              });
            }
            async function submit(e){
              const form=document.getElementById('authForm');
              const title=document.getElementById('authTitle');
              if(!form || !title || !/log\\s*in/i.test(title.textContent||'')) return;
              e.preventDefault();
              e.stopPropagation();
              if(e.stopImmediatePropagation) e.stopImmediatePropagation();
              const email=(document.getElementById('authEmail')?.value||'').trim();
              const password=document.getElementById('authPassword')?.value||'';
              const error=document.getElementById('authError');
              const button=document.getElementById('authSubmit');
              const text=document.getElementById('authSubmitText');
              const show=(msg)=>{if(error){error.textContent=msg;error.style.display='block'}};
              if(error){error.textContent='';error.style.display='none'}
              if(!email || !password){show('Please enter your email and password.');return false;}
              if(button)button.disabled=true;
              if(text)text.textContent='Logging in...';
              try{
                await loadSupabase();
                const sb=window.supabase.createClient(URL,KEY);
                const {data,error:authError}=await sb.auth.signInWithPassword({email,password});
                if(authError) throw authError;
                localStorage.setItem('zevaniUserEmail',data.user?.email||email);
                localStorage.setItem('zevaniUserName',data.user?.user_metadata?.name || email.split('@')[0]);
                let tries=0;
                const go=()=>{
                  if(typeof window.openZevaniDashboard==='function'){
                    window.openZevaniDashboard();
                    return;
                  }
                  if(tries++<20) setTimeout(go,100);
                };
                setTimeout(go,150);
              }catch(err){show(err?.message||'Login failed. Please check your email and password.');}
              finally{
                if(button)button.disabled=false;
                if(text)text.textContent='Log In';
              }
              return false;
            }
            function wire(){
              const form=document.getElementById('authForm');
              if(!form || form.dataset.finalLoginFix==='1') return;
              form.dataset.finalLoginFix='1';
              form.addEventListener('submit',submit,true);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wire); else wire();
            setTimeout(wire,100);setTimeout(wire,500);setTimeout(wire,1500);
          })();
          </script>'''
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final fix
        run: |
          git config user.name 'ZEVANI Fix Bot'
          git config user.email 'actions@github.com'
          git add index-current.html
          git commit -m 'Apply final ZEVANI login fix' || exit 0
          git push
