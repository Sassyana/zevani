name: ZEVANI login fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Supabase client is available inside ZEVANI iframe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-current.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in index-current.html')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Added Supabase client to index-current.html')
          else:
              print('Supabase client already present')
          PY

      - name: Commit login fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-current.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix ZEVANI login authentication [skip ci]"
            git push
          fi
