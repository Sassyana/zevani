name: Fix ZEVANI Login Button
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-login:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace conflicting login button handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ZEVANI LOGIN BUTTON FIX -->'
          if marker not in s:
              code=r'''<!-- ZEVANI LOGIN BUTTON FIX -->
<script>
(function(){
  function fixLoginButtons(){
    document.querySelectorAll('button').forEach(function(oldButton){
      if((oldButton.textContent||'').trim()!=='Log In') return;
      if(oldButton.dataset.zevaniLoginFixed==='1') return;
      var button=oldButton.cloneNode(true);
      button.dataset.zevaniLoginFixed='1';
      button.removeAttribute('onclick');
      oldButton.replaceWith(button);
      button.addEventListener('click',function(event){
        event.preventDefault();
        event.stopImmediatePropagation();
        if(typeof window.showAuth==='function'){
          window.showAuth('login');
        }else{
          var modal=document.getElementById('zFinalAuth')||document.getElementById('zevaniAuthModal');
          if(modal){modal.classList.add('show');}
        }
      },true);
    });
  }
  fixLoginButtons();
  window.addEventListener('load',fixLoginButtons);
  setTimeout(fixLoginButtons,100);
  setTimeout(fixLoginButtons,500);
})();
</script>
'''
              s=s.replace('</body>',code+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit login button fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Log In button to open login mode"
          git push
