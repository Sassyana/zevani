name: Clean ZEVANI Authentication
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  clean-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ZEVANI files
        run: |
          test -s index.html
          echo "index.html is present and non-empty"
