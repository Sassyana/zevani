name: Fix ZEVANI Auth UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair visible account controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''
<style id="zevani-auth-ui">
.account-bar{display:flex;align-items:center;gap:8px;margin-left:auto}.account-bar button{white-space:nowrap}.account-email{font-size:12px;color:#59616e;max-width:180px;overflow:hidden;text-overflow:ellipsis}.logout-button{border:1px solid #c9c3b6;background:white;color:#101a2d;padding:9px 14px;border-radius:22px;font-size:12px;font-weight:bold}.auth-section{min-height:100vh;padding:130px 7% 80px;background:#f7f4ed;display:flex;align-items:center;justify-content:center}.auth-card{width:100%;max-width:520px;background:white;border:1px solid #e4dfd5;border-radius:30px;padding:45px;box-shadow:0 25px 60px rgba(0,0,0,.08)}.auth-card h2{font-family:Georgia,serif;font-size:42px;font-weight:normal;color:#101a2d;margin:12px 0}.auth-card p{color:#707887;line-height:1.6;margin-bottom:22px}.auth-input{width:100%;padding:16px;border:1px solid #e4dfd5;border-radius:14px;font-size:15px;outline:none;margin-bottom:12px}.auth-message{padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:15px;display:none}.auth-error{background:#fff0ef;color:#a94442}.auth-success{background:#edf8ef;color:#3d7d4a}.auth-switch{text-align:center;margin-top:20px;font-size:13px}.auth-switch button{border:0;background:none;color:#9a7d4b;font-weight:bold}.hidden{display:none!important}@media(max-width:900px){.account-bar{margin-left:0}.auth-card{padding:30px 22px}}
</style>
'''
          if 'id="zevani-auth-ui"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          nav='''
<div id="guestAuthButtons" class="account-bar">
<button class="logout-button" type="button" onclick="showAuth('login')">Log In</button>
<button class="primary" type="button" style="padding:9px 15px" onclick="showAuth('register')">Create Account</button>
</div>
<div id="accountBar" class="account-bar" style="display:none">
<span id="accountEmail" class="account-email"></span>
<button class="logout-button" type="button" onclick="logoutUser()">Log Out</button>
</div>
'''
          if 'id="guestAuthButtons"' not in s:
              s=s.replace('</nav>',nav+'</nav>',1)

          auth='''
<section id="authPage" class="auth-section hidden">
<div class="auth-card">
<div class="label" id="authLabel">CREATE YOUR ACCOUNT</div>
<h2 id="authTitle">Join ZEVANI.</h2>
<p id="authText">Create your private member account and save your ZEVANI companion.</p>
<div id="authError" class="auth-message auth-error"></div>
<div id="authSuccess" class="auth-message auth-success"></div>
<form id="authForm">
<input id="authName" class="auth-input" type="text" autocomplete="name" placeholder="Your name">
<input id="authEmail" class="auth-input" type="email" required autocomplete="email" placeholder="Email address">
<input id="authPassword" class="auth-input" type="password" required minlength="6" autocomplete="new-password" placeholder="Password (at least 6 characters)">
<input id="authPasswordConfirm" class="auth-input" type="password" required minlength="6" autocomplete="new-password" placeholder="Confirm password">
<button id="authSubmit" class="primary" type="submit" style="width:100%"><span id="authSubmitText">Create Account</span></button>
</form>
<div class="auth-switch"><span id="authSwitchText">Already have an account?</span> <button type="button" onclick="toggleAuthMode()" id="authSwitchButton">Log in</button></div>
<br><button class="back-button" type="button" onclick="showHome()" style="width:100%">Back to Home</button>
</div></section>
<script>
(function(){
const U='https://hfdembdqzsedjbgemtdp.supabase.co',K='sb_publishable_NZAxQrtZ-sssoeIGVySf3w_1c0Io_xu';
let mode='register',user=null;let sb=null;
function ready(){if(window.supabase&&!sb)sb=window.supabase.createClient(U,K);return !!sb}
window.showAuth=function(m){mode=m||'register';['homePage','betaPage','builderPage','profilePage','chatPage','zevaniDashboard'].forEach(id=>{let x=document.getElementById(id);if(x)x.classList.add('hidden')});let a=document.getElementById('authPage');if(a)a.classList.remove('hidden');update();window.scrollTo(0,0)};
window.toggleAuthMode=function(){mode=mode==='register'?'login':'register';update()};
function update(){let r=mode==='register';document.getElementById('authLabel').textContent=r?'CREATE YOUR ACCOUNT':'LOG IN';document.getElementById('authTitle').textContent=r?'Join ZEVANI.':'Welcome back.';document.getElementById('authText').textContent=r?'Create your private member account and save your ZEVANI companion.':'Log in to continue to your ZEVANI account.';document.getElementById('authName').style.display=r?'block':'none';document.getElementById('authPasswordConfirm').style.display=r?'block':'none';document.getElementById('authSubmitText').textContent=r?'Create Account':'Log In';document.getElementById('authSwitchText').textContent=r?'Already have an account?':'Don\'t have an account yet?';document.getElementById('authSwitchButton').textContent=r?'Log in':'Create one'}
function message(id,t){let x=document.getElementById(id);x.textContent=t;x.style.display='block'}
function clear(){document.getElementById('authError').style.display='none';document.getElementById('authSuccess').style.display='none'}
async function submit(e){e.preventDefault();clear();if(!ready()){message('authError','Authentication service is loading. Please try again in a moment.');return}let email=document.getElementById('authEmail').value.trim(),pw=document.getElementById('authPassword').value,name=document.getElementById('authName').value.trim();if(mode==='register'){if(pw!==document.getElementById('authPasswordConfirm').value){message('authError','Your passwords do not match.');return}let q=await sb.auth.signUp({email,password:pw,options:{data:{name:name||email.split('@')[0]},emailRedirectTo:location.href.split('#')[0]}});if(q.error)message('authError',q.error.message);else message('authSuccess','Account created! Check your email and click the verification link before logging in.')}else{let q=await sb.auth.signInWithPassword({email,password:pw});if(q.error)message('authError',q.error.message);else{user=q.data.user;updateUI();if(typeof openZevaniDashboard==='function')openZevaniDashboard()}}}
document.getElementById('authForm').addEventListener('submit',submit);
function updateUI(){let g=document.getElementById('guestAuthButtons'),b=document.getElementById('accountBar'),e=document.getElementById('accountEmail');if(user){g.style.display='none';b.style.display='flex';e.textContent=user.email||''}else{g.style.display='flex';b.style.display='none'}}
window.logoutUser=async function(){if(ready())await sb.auth.signOut();user=null;updateUI();if(typeof showHome==='function')showHome()};
setTimeout(function(){if(ready()){sb.auth.getSession().then(x=>{user=x.data.session&&x.data.session.user;updateUI()});sb.auth.onAuthStateChange(function(_,s){user=s&&s.user;updateUI()})}else updateUI()},500);
})();
</script>
'''
          if 'id="authForm"' not in s:
              s=s.replace('<!-- HOME -->',auth+'\n<!-- HOME -->',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair visible ZEVANI account controls" || true
          git push
