<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVANI — Companion Library</title><style>:root{--n:#101a2d;--c:#f7f4ed;--g:#c7a86b;--m:#707887;--l:#e5dfd4}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#202633;font:16px Arial}.nav{padding:18px 6%;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:22px}.brand{font-weight:800;letter-spacing:5px;color:var(--n);font-size:22px;margin-right:auto;cursor:pointer}.brand span{color:var(--g)}.nav a{color:var(--m);text-decoration:none;font-size:14px}.nav a:hover{color:var(--n)}.hero{max-width:1200px;margin:auto;padding:55px 6% 20px;text-align:center}.eyebrow{color:#9a7d4b;font-size:11px;font-weight:800;letter-spacing:3px}.hero h1{font:normal clamp(42px,6vw,68px) Georgia,serif;color:var(--n);margin:14px 0}.hero p{max-width:650px;margin:auto;color:var(--m);line-height:1.7}.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:32px auto 40px}.filter{border:1px solid var(--l);background:#fff;color:var(--m);padding:11px 18px;border-radius:24px;font-weight:700;cursor:pointer}.filter.active{background:var(--n);color:#fff;border-color:var(--n)}.more{position:relative}.menu{display:none;position:absolute;top:48px;right:0;background:#fff;border:1px solid var(--l);border-radius:16px;padding:8px;box-shadow:0 12px 35px #101a2d20;z-index:20;min-width:190px}.more.open .menu{display:block}.menu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px;border-radius:10px;cursor:pointer}.library{max-width:1200px;margin:auto;padding:0 6% 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;border:1px solid var(--l);border-radius:24px;overflow:hidden;cursor:pointer;box-shadow:0 8px 28px #101a2d10;transition:.2s}.card:hover{transform:translateY(-4px)}.face{height:270px;background:#ddd}.face img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.name{font:normal 27px Georgia,serif;color:var(--n)}.identity{font-size:12px;color:var(--m);margin-top:5px}.desc{font-size:14px;line-height:1.55;margin-top:12px}.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--m)}.modal{display:none;position:fixed;inset:0;background:#080d17cc;z-index:50;align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.modal-card{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px;display:grid;grid-template-columns:.9fr 1.1fr;position:relative}.modal-photo{min-height:600px}.modal-photo img{width:100%;height:100%;object-fit:cover}.content{padding:42px}.close{position:absolute;right:15px;top:13px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:26px;cursor:pointer}.content h2{font:normal 50px Georgia,serif;color:var(--n);margin:8px 0}.story{color:var(--m);line-height:1.8}.meet{margin-top:25px;width:100%;padding:14px;border:0;border-radius:25px;background:var(--n);color:#fff;font-weight:800;cursor:pointer}.note{margin-top:12px;text-align:center;font-size:11px;color:var(--m)}@media(max-width:900px){.library{grid-template-columns:repeat(2,1fr)}.modal-card{grid-template-columns:1fr}.modal-photo{min-height:400px}}@media(max-width:600px){.nav{flex-wrap:wrap}.nav a{font-size:13px}.library{grid-template-columns:1fr}.content{padding:25px}.content h2{font-size:40px}}</style></head><body><nav class="nav"><div class="brand" id="zevaniHome">ZEVANI<span>•</span></div><a href="../">⌂ Home</a><a href="./">My ZEVANI</a></nav><section class="hero"><div class="eyebrow">THE COMPANION LIBRARY</div><h1>Meet someone before you choose them.</h1><p>Browse personalities, identities and stories first. When you find someone who feels right, you can meet them.</p><div id="filters" class="filters"></div></section><main id="library" class="library"></main><div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeProfile()">×</button><div class="modal-photo"><img id="modalImage" alt=""></div><div class="content"><div class="eyebrow">COMPANION PROFILE</div><h2 id="modalName"></h2><div id="modalIdentity" class="identity"></div><p id="modalStory" class="story"></p><button class="meet" onclick="meetCompanion()">Meet Them</button><div class="note">Your choice will be remembered so your ZEVANI profile can keep this companion.</div></div></div></div><script>const companions=[['Sofia','Woman','she/her','Women','Creative, confident and beautifully unpredictable.','Sofia is warm, curious and adventurous. She loves meaningful conversations, spontaneous plans and finding beauty in ordinary moments.','https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=85'],['Isabella','Woman','she/her','Women','Elegant, thoughtful and quietly playful.','Isabella is observant and compassionate. She enjoys art, music, late-night conversations and helping people see possibilities they had overlooked.','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=900&q=85'],['Claire','Woman','she/her','Women','Gentle, caring and deeply curious.','Claire has a calm presence and a wonderful sense of humor. She enjoys books, travel and conversations that go beyond small talk.','https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=85'],['Daniel','Man','he/him','Men','Calm, loyal and protective.','Daniel is dependable and warm. He enjoys making people laugh, learning new things and being the person you can count on when life gets complicated.','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85'],['Alexander','Man','he/him','Men','Charming, witty and adventurous.','Alexander loves good conversation, travel and a little harmless mischief. He is confident without taking himself too seriously.','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=85'],['Marcus','Man','he/him','Men','Intelligent, thoughtful and mysterious.','Marcus is reflective and curious about the world. He enjoys history, strategy and conversations where two people can challenge each other respectfully.','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=85'],['Lyra','Woman','she/her','Fantasy','An ancient elven healer with a gentle spirit.','Lyra is an elven healer who has wandered through forests and kingdoms for centuries. She is patient, perceptive and fascinated by the changing human world.','https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=85'],['Adrian','Man','he/him','Fantasy','A mysterious vampire with a surprisingly warm heart.','Adrian has lived for centuries and collected more stories than he can remember. Beneath his mysterious exterior is someone who values loyalty, wit and genuine connection.','https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=85'],['Rowan','Non-binary','they/them','Fantasy','An enigmatic fae guide with a mischievous streak.','Rowan belongs to the fae and walks easily between worlds. They are playful, perceptive and fascinated by people who are brave enough to be themselves.','https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85'],['River','Gender-fluid','they/them','Gender-fluid','Free-spirited, empathetic and endlessly curious.','River believes identity can be a journey rather than a box. They are open-minded, creative and happiest when discovering something new with someone they trust.','https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=900&q=85'],['Alex','Non-binary','they/them','Non-binary','Warm, intelligent and quietly funny.','Alex is an attentive conversationalist who enjoys technology, books and exploring new ideas. They value honesty, kindness and connections that feel natural.','https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=900&q=85'],['Nova','Other','they/them','Other','Independent, imaginative and wonderfully unconventional.','Nova never felt the need to fit neatly into a category. They are creative, compassionate and drawn to people who appreciate individuality.','https://images.unsplash.com/photo-1502823403499-6ccfcf4fbce?auto=format&fit=crop&w=900&q=85'],['Elara','Woman','she/her','Fantasy','A fearless warrior princess with a tender side.','Elara was raised to lead but dreams of a life where she can choose her own path. She is courageous, loyal and unexpectedly sentimental.','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=900&q=85'],['Cassian','Man','he/him','Fantasy','A witty wizard who is always one spell ahead.','Cassian is a scholar of ancient magic who prefers clever solutions to brute force. He is playful, curious and fascinated by the ordinary world.','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85']];let currentFilter='Women',currentCompanion=null;function buildFilters(){const f=document.getElementById('filters');f.innerHTML='<button class="filter active" data-filter="Women">💕 Women</button><button class="filter" data-filter="Men">💙 Men</button><button class="filter" data-filter="Fantasy">🏰 Fantasy</button><div class="more"><button class="filter" id="moreButton">More ▾</button><div class="menu"><button data-filter="Non-binary">🟣 Non-binary</button><button data-filter="Gender-fluid">🌈 Gender-fluid</button><button data-filter="Other">✨ Other</button></div></div>';f.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>selectFilter(b.dataset.filter));document.getElementById('moreButton').onclick=e=>{e.stopPropagation();document.querySelector('.more').classList.toggle('open')};document.addEventListener('click',()=>document.querySelector('.more')?.classList.remove('open'))}function selectFilter(filter){currentFilter=filter;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));const b=[...document.querySelectorAll('.filter')].find(x=>x.dataset.filter===filter);if(b)b.classList.add('active');render()}function render(){const list=companions.filter(c=>c[3]===currentFilter),grid=document.getElementById('library');grid.innerHTML=list.length?list.map(c=>`<article class="card" onclick="openProfile(${companions.indexOf(c)})"><div class="face"><img src="${c[6]}" alt="${c[0]}"></div><div class="body"><div class="name">${c[0]}</div><div class="identity">${c[1]} · ${c[2]}</div><div class="desc">${c[4]}</div></div></article>`).join(''):'<div class="empty">No companions are in this collection yet.</div>'}function openProfile(i){const c=companions[i];currentCompanion=c;document.getElementById('modalImage').src=c[6];document.getElementById('modalName').textContent=c[0];document.getElementById('modalIdentity').textContent=c[1]+' · '+c[2];document.getElementById('modalStory').textContent=c[5];document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}function closeProfile(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}function meetCompanion(){if(!currentCompanion)return;const c={name:currentCompanion[0],gender:currentCompanion[1],pronouns:currentCompanion[2],category:currentCompanion[3],personality:currentCompanion[4],story:currentCompanion[5],image:currentCompanion[6],selectedAt:new Date().toISOString(),source:'library',id:'library-'+currentCompanion[0].toLowerCase().replace(/[^a-z0-9]+/g,'-')};localStorage.setItem('zevaniPendingCompanion',JSON.stringify(c));location.href='../meet/'}buildFilters();render();</script></body></html>
