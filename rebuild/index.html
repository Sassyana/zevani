ing:5px;margin-right:auto}.grid{max-width:1050px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e4dfd5;border-radius:22px;overflow:hidden}.card img{width:100%;height:260px;object-fit:cover}.body{padding:18px}.name{font:28px Georgia}.desc{color:#707887;line-height:1.5;margin:10px 0 18px}.btn{border:0;border-radius:24px;background:#101a2d;color:white;padding:12px 18px;cursor:pointer}.profile{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.box{background:white;border-radius:24px;max-width:800px;width:100%;padding:30px}.box img{width:100%;max-height:420px;object-fit:cover;border-radius:18px}.close{float:right;border:0;background:none;font-size:25px}@media(max-width:750px){.grid{grid-template-columns:1fr}}`;document.write('<style>'+style+'</style><nav class="nav"><div class="brand" onclick="location.href=\'../\'">ZEVANI•</div><a href="../">Home</a></nav><main><h1 style="text-align:center;font:48px Georgia;margin:45px 0 10px">Meet Your Companion</h1><p style="text-align:center;color:#707887">Choose someone who feels right.</p><div id="grid" class="grid"></div></main><div id="profile" class="profile"><div class="box"><button class="close" onclick="closeP()">×</button><img id="pimg"><h2 id="pname" style="font:42px Georgia"></h2><p id="pdesc" style="line-height:1.7;color:#707887"></p><button class="btn" onclick="meet()">Meet Them</button></div></div>');let cur;function render(){grid.innerHTML=c.map((x,i)=>`<article class="card"><img src="${x[6]}"><div class="body"><div class="name">${x[0]}</div><div>${x[1]} · ${x[2]}</div><div class="desc">${x[4]}</div><button class="btn" onclick="openP(${i})">View Profile</button></div></article>`).join('')}function openP(i){cur=c[i];pimg.src=cur[6];pname.textContent=cur[0];pdesc.textContent=cur[5];profile.style.display='flex'}function closeP(){profile.style.display='none'}function meet(){if(!cur)re
