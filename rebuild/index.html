<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVANI — Companion Library</title><style>:root{--n:#101a2d;--c:#f7f4ed;--g:#c7a86b;--m:#707887;--b:#e4dfd5}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font:16px Arial,sans-serif}.nav{padding:20px 7%;background:#fff;border-bottom:1px solid var(--b);display:flex;gap:22px;align-items:center}.brand{font-weight:800;letter-spacing:5px;margin-right:auto;cursor:pointer}.nav a{color:var(--n);text-decoration:none}.section{max-width:1050px;margin:35px auto;padding:0 20px}.title{text-align:center;font:48px Georgia;margin:35px 0 10px}.lead{text-align:center;color:var(--m);margin-bottom:35px}.saved{display:none;background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px;margin-bottom:35px}.saved h2{font:30px Georgia;margin:0 0 16px}.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.saved-card{display:flex;gap:12px;align-items:center;border:1px solid var(--b);border-radius:16px;padding:12px}.saved-card img{width:55px;height:55px;border-radius:50%;object-fit:cover}.saved-card strong{display:block}.saved-card small{color:var(--m)}.saved-card button{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--b);border-radius:22px;overflow:hidden}.card img{width:100%;height:260px;object-fit:cover}.body{padding:18px}.name{font:28px Georgia}.desc{color:var(--m);line-height:1.5;margin:10px 0 18px}.btn{border:0;border-radius:24px;background:var(--n);color:#fff;padding:12px 18px;cursor:pointer}.profile{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.box{background:#fff;border-radius:24px;max-width:800px;width:100%;padding:30px}.box img{width:100%;max-height:420px;object-fit:cover;border-radius:18px}.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.savedbtn{background:#c7a86b;color:#101a2d}.historybtn{background:#fff;color:#101a2d;border:1px solid #c7a86b}@media(max-width:750px){.grid,.saved-grid{grid-template-columns:1fr}} </style></head><body><nav class="nav"><div class="brand" onclick="location.href='../'">ZEVANI•</div><a href="../">Home</a></nav><main><section class="section"><h1 class="title">Meet Your Companion</h1><p class="lead">Choose someone who feels right.</p><div id="saved" class="saved"><h2>My Companions</h2><div id="savedGrid" class="saved-grid"></div></div><div id="grid" class="grid"></div></section></main><div id="profile" class="profile"><div class="box"><button class="close" onclick="closeP()">×</button><img id="pimg"><h2 id="pname" style="font:42px Georgia"></h2><p id="pdesc" style="line-height:1.7;color:#707887"></p><div class="actions"><button class="btn savedbtn" id="saveBtn" onclick="saveCompanion()">♡ Save Companion</button><button class="btn historybtn" id="historyBtn" onclick="openHistory()">View Chat History</button><button class="btn" onclick="meet()">Meet Them</button></div></div></div><script>const c=[['Sofia','Woman','she/her','Women','Creative, confident and beautifully unpredictable.','Sofia is warm, curious and adventurous.','https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=85'],['Isabella','Woman','she/her','Women','Elegant, thoughtful and quietly playful.','Isabella is observant and compassionate.','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=900&q=85'],['Claire','Woman','she/her','Women','Gentle, caring and deeply curious.','Claire has a calm presence and a wonderful sense of humor.','https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=85'],['Daniel','Man','he/him','Men','Calm, loyal and protective.','Daniel is dependable and warm.','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85'],['Alexander','Man','he/him','Men','Charming, witty and adventurous.','Alexander loves good conversation, travel and a little harmless mischief.','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=85'],['Marcus','Man','he/him','Men','Intelligent, thoughtful and mysterious.','Marcus is reflective and curious about the world.','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=85'],['Alex','Non-binary','they/them','Non-binary','Warm, intelligent and quietly funny.','Alex is an attentive conversationalist who enjoys technology, books and exploring new ideas.','https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=900&q=85']];let cur;const key='zevaniSavedCompanions';function getSaved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function setSaved(v){localStorage.setItem(key,JSON.stringify(v))}function obj(x){return{id:'library-'+x[0].toLowerCase().replace(/[^a-z0-9]+/g,'-'),name:x[0],gender:x[1],pronouns:x[2],category:x[3],personality:x[4],story:x[5],image:x[6],source:'library'}}function renderSaved(){const s=getSaved();saved.style.display=s.length?'block':'none';savedGrid.innerHTML=s.map(x=>`<div class="saved-card"><img src="${x.image}"><div><strong>${x.name}</strong><small>${x.category||'Companion'}</small></div><button class="btn" onclick="openSaved('${x.id}')">Open</button></div>`).join('')}function render(){grid.innerHTML=c.map((x,i)=>`<article class="card"><img src="${x[6]}"><div class="body"><div class="name">${x[0]}</div><div>${x[1]} · ${x[2]}</div><div class="desc">${x[4]}</div><button class="btn" onclick="openP(${i})">View Profile</button></div></article>`).join('');renderSaved()}function openP(i){cur=obj(c[i]);pimg.src=cur.image;pname.textContent=cur.name;pdesc.textContent=cur.story;profile.style.display='flex';updateButtons()}function openSaved(id){const x=getSaved().find(v=>v.id===id);if(!x)return;cur=x;pimg.src=cur.image;pname.textContent=cur.name;pdesc.textContent=cur.story;profile.style.display='flex';updateButtons()}function updateButtons(){const has=getSaved().some(x=>x.id===cur.id);saveBtn.textContent=has?'✓ Saved to My Companions':'♡ Save Companion';historyBtn.style.display=localStorage.getItem('zevaniChat_'+cur.id)?'inline-block':'none'}function saveCompanion(){const s=getSaved();if(!s.some(x=>x.id===cur.id)){s.push(cur);setSaved(s)}updateButtons();renderSaved()}function openHistory(){localStorage.setItem('zevaniPendingCompanion',JSON.stringify(cur));location.href='../meet/?companion='+encodeURIComponent(cur.id)+'&history=1'}function closeP(){profile.style.display='none'}function meet(){if(!cur)return;localStorage.setItem('zevaniPendingCompanion',JSON.stringify(cur));location.href='../meet/?companion='+encodeURIComponent(cur.id)}render();</script></body></html>
