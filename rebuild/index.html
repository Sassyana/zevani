<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVANI — Companion Library</title><style>:root{--n:#101a2d;--c:#f7f4ed;--g:#c7a86b;--m:#707887;--b:#e4dfd5}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font:16px Arial,sans-serif}.nav{padding:20px 7%;background:#fff;border-bottom:1px solid var(--b);display:flex;gap:22px;align-items:center}.brand{font-weight:800;letter-spacing:5px;margin-right:auto;cursor:pointer}.nav a{color:var(--n);text-decoration:none}.section{max-width:1050px;margin:35px auto;padding:0 20px}.title{text-align:center;font:48px Georgia;margin:35px 0 10px}.lead{text-align:center;color:var(--m);margin-bottom:35px}.saved{display:none;background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px;margin-bottom:35px}.saved h2{font:30px Georgia;margin:0 0 16px}.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.saved-card{display:flex;gap:12px;align-items:center;border:1px solid var(--b);border-radius:16px;padding:12px}.saved-card img{width:55px;height:55px;border-radius:50%;object-fit:cover}.saved-card strong{display:block}.saved-card small{color:var(--m)}.saved-card .mini-actions{margin-left:auto;display:flex;gap:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:2px solid var(--b);border-radius:22px;overflow:hidden;transition:.15s}.card.saved-card-active{border-color:var(--g);box-shadow:0 0 0 3px #c7a86b33}.card img{width:100%;height:260px;object-fit:cover;cursor:pointer;transition:.2s}.card img:hover{filter:brightness(.82);transform:scale(1.01)}.photo-wrap{position:relative;overflow:hidden}.photo-wrap:after{content:'View Profile';position:absolute;inset:auto 0 0 0;padding:10px;text-align:center;background:#101a2dcc;color:#fff;opacity:0;transition:.2s;pointer-events:none}.photo-wrap:hover:after{opacity:1}.body{padding:18px}.name{font:28px Georgia}.desc{color:var(--m);line-height:1.5;margin:10px 0 18px}.btn{border:0;border-radius:24px;background:var(--n);color:#fff;padding:11px 17px;cursor:pointer;font-weight:bold}.choose{background:var(--g);color:var(--n)}.saved-label{display:none;color:#8b7043;font-size:12px;font-weight:bold;margin-bottom:8px}.card.saved-card-active .saved-label{display:block}.profile{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.box{background:#fff;border-radius:24px;max-width:800px;width:100%;padding:30px}.box img{width:100%;max-height:420px;object-fit:cover;border-radius:18px}.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.savedbtn{background:#c7a86b;color:#101a2d}.historybtn{background:#fff;color:#101a2d;border:1px solid #c7a86b}.deletebtn{background:#fff;color:#9b3030;border:1px solid #d88}@media(max-width:750px){.grid,.saved-grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="brand" onclick="location.href='../'">ZEVANI•</div><a href="../">Home</a></nav><main><section class="section"><h1 class="title">Meet Your Companion</h1><p class="lead">Choose a companion to add them to My Companions. Click again to remove them.</p><div id="saved" class="saved"><h2>My Companions</h2><div id="savedGrid" class="saved-grid"></div></div><div id="grid" class="grid"></div></section></main><div id="profile" class="profile"><div class="box"><button class="close" onclick="closeP()">×</button><img id="pimg"><h2 id="pname" style="font:42px Georgia"></h2><p id="pdesc" style="line-height:1.7;color:#707887"></p><div class="actions"><button class="btn choose" id="selectBtn" onclick="toggleSavedCurrent()">Choose Companion</button><button class="btn" onclick="meet()">Meet Them</button><button class="btn historybtn" id="historyBtn" onclick="openHistory()">View Chat History</button><button class="btn deletebtn" id="deleteBtn" onclick="deleteCurrent()">Delete Companion</button></div></div></div><script>const c=[['Sofia','Woman','she/her','Women','Creative, confident and beautifully unpredictable.','Sofia is warm, curious and adventurous.','https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=85'],['Isabella','Woman','she/her','Women','Elegant, thoughtful and quietly playful.','Isabella is observant and compassionate.','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=900&q=85'],['Claire','Woman','she/her','Women','Gentle, caring and deeply curious.','Claire has a calm presence and a wonderful sense of humor.','https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=85'],['Daniel','Man','he/him','Men','Calm, loyal and protective.','Daniel is dependable and warm.','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85'],['Alexander','Man','he/him','Men','Charming, witty and adventurous.','Alexander loves good conversation, travel and a little harmless mischief.','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=85'],['Marcus','Man','he/him','Men','Intelligent, thoughtful and mysterious.','Marcus is reflective and curious about the world.','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=85'],['Alex','Non-binary','they/them','Non-binary','Warm, intelligent and quietly funny.','Alex is an attentive conversationalist who enjoys technology, books and exploring new ideas.','https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=900&q=85']];let cur;const key='zevaniSavedCompanions';function getSaved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function setSaved(v){localStorage.setItem(key,JSON.stringify(v))}function obj(x){return{id:'library-'+x[0].toLowerCase().replace(/[^a-z0-9]+/g,'-'),name:x[0],gender:x[1],pronouns:x[2],category:x[3],personality:x[4],story:x[5],image:x[6],source:'library'}}function isSaved(id){return getSaved().some(x=>x.id===id)}function renderSaved(){const s=getSaved();saved.style.display=s.length?'block':'none';savedGrid.innerHTML=s.map(x=>`<div class="saved-card"><img src="${x.image||''}"><div><strong>${x.name}</strong><small>${x.category||'Companion'}</small></div><div class="mini-actions"><button class="btn" onclick="openSaved('${x.id}')">Open</button><button class="btn deletebtn" onclick="removeSaved('${x.id}')">Remove</button></div></div>`).join('')}function render(){grid.innerHTML=c.map((x,i)=>{const id='library-'+x[0].toLowerCase().replace(/[^a-z0-9]+/g,'-');const savedNow=isSaved(id);return `<article class="card ${savedNow?'saved-card-active':''}"><div class="photo-wrap"><img src="${x[6]}" alt="${x[0]}" title="View ${x[0]}'s profile" onclick="openP(${i})"></div><div class="body"><div class="saved-label">✓ SAVED TO MY COMPANIONS</div><div class="name">${x[0]}</div><div>${x[1]} · ${x[2]}</div><div class="desc">${x[4]}</div><button class="btn choose" onclick="toggleSaved(${i})">${savedNow?'✓ Saved — Click to Unsave':'Choose Companion'}</button> <button class="btn" onclick="openP(${i})">View Profile</button></div></article>`}).join('');renderSaved()}function openP(i){cur=obj(c[i]);showProfile()}function openSaved(id){const x=getSaved().find(v=>v.id===id);if(!x)return;cur=x;showProfile()}function showProfile(){pimg.src=cur.image||'';pname.textContent=cur.name;pdesc.textContent=cur.story||cur.personality||'';profile.style.display='flex';updateButtons()}function updateButtons(){const savedNow=isSaved(cur.id);selectBtn.textContent=savedNow?'✓ Saved — Click to Unsave':'Choose Companion';selectBtn.className=savedNow?'btn':'btn choose';historyBtn.style.display=localStorage.getItem('zevaniChat_'+cur.id)?'inline-block':'none';deleteBtn.style.display=cur.source==='custom'?'inline-block':'none'}function toggleSavedCurrent(){if(!cur)return;toggleSavedObject(cur)}function toggleSaved(i){toggleSavedObject(obj(c[i]))}function toggleSavedObject(x){const s=getSaved();if(s.some(v=>v.id===x.id)){removeSaved(x.id)}else{s.push(x);setSaved(s);cur=x;updateButtons();render()}}function removeSaved(id){setSaved(getSaved().filter(x=>x.id!==id));closeP();render()}function openHistory(){localStorage.setItem('zevaniPendingCompanion',JSON.stringify(cur));location.href='../meet.html?companion='+encodeURIComponent(cur.id)+'&history=1'}function meet(){if(!cur)return;localStorage.setItem('zevaniPendingCompanion',JSON.stringify(cur));location.href='../meet.html?companion='+encodeURIComponent(cur.id)}function deleteCurrent(){if(!cur||cur.source!=='custom')return;if(confirm('Delete '+cur.name+'? This cannot be undone.'))removeSaved(cur.id)}function closeP(){profile.style.display='none'}render();</script></body></html>
