<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}
#zevaniApp{display:block;width:100%;height:100%;border:0}
#zevaniLoginModal{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:rgba(16,26,45,.72);padding:20px;box-sizing:border-box}
#zevaniLoginModal.show{display:flex}
.z-login-card{width:min(500px,100%);background:#fff;border-radius:30px;padding:40px;box-shadow:0 30px 90px rgba(0,0,0,.3);box-sizing:border-box}
.z-login-label{color:#c7a86b;text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:bold}
.z-login-card h2{font-family:Georgia,serif;font-size:42px;font-weight:normal;color:#101a2d;margin:12px 0}
.z-login-card p{color:#707887;line-height:1.6;margin-bottom:22px}
.z-login-input{width:100%;padding:16px;border:1px solid #e4dfd5;border-radius:14px;font-size:15px;box-sizing:border-box;margin-bottom:12px;outline:none}
.z-login-input:focus{border-color:#c7a86b}
.z-login-error{display:none;background:#fff0ef;color:#a94442;padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px}
.z-login-button{width:100%;border:0;background:#101a2d;color:#fff;padding:16px;border-radius:30px;font-weight:bold;font-size:15px;cursor:pointer}
.z-login-button:disabled{opacity:.65;cursor:wait}
.z-login-back{width:100%;margin-top:12px;background:#fff;border:1px solid #c9c3b6;color:#101a2d;padding:14px;border-radius:30px;font-weight:bold;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<iframe id="zevaniApp" src="index-current.html" title="ZEVANI"></iframe>

<div id="zevaniLoginModal" aria-hidden="true">
  <div class="z-login-card">
    <div class="z-login-label">ZEVANI</div>
    <h2>Welcome back.</h2>
    <p>Log in to continue to your ZEVANI account.</p>
    <div id="zLoginError" class="z-login-error"></div>
    <form id="zLoginForm">
      <input id="zLoginEmail" class="z-login-input" type="email" autocomplete="email" placeholder="Email address" required>
      <input id="zLoginPassword" class="z-login-input" type="password" autocomplete="current-password" placeholder="Password" required>
      <button id="zLoginSubmit" class="z-login-button" type="submit">Log In</button>
    </form>
    <button id="zLoginBack" class="z-login-back" type="button">← Back</button>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL='https://hfdembdqzsedjbgemtdp.supabase.co';
  const SUPABASE_KEY='sb_publishable_NZAxQrtZ-sssoeIGVySf3w_1c0Io_xu';
  const frame=document.getElementById('zevaniApp');
  const modal=document.getElementById('zevaniLoginModal');
  const form=document.getElementById('zLoginForm');
  const email=document.getElementById('zLoginEmail');
  const password=document.getElementById('zLoginPassword');
  const error=document.getElementById('zLoginError');
  const submit=document.getElementById('zLoginSubmit');
  const back=document.getElementById('zLoginBack');
  const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  function openLogin(){
    error.style.display='none';
    error.textContent='';
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    setTimeout(()=>email.focus(),50);
  }

  function closeLogin(){
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
  }

  function goToDashboard(){
    try{
      const w=frame.contentWindow;
      if(w && typeof w.openDashboard==='function'){
        w.openDashboard();
        return;
      }
      const d=frame.contentDocument;
      if(d){
        ['homePage','betaPage','builderPage','profilePage','chatPage','authPage'].forEach(id=>{
          const el=d.getElementById(id);
          if(el) el.classList.add('hidden');
        });
        const dash=d.getElementById('zevaniDashboard');
        if(dash){dash.classList.remove('hidden');dash.classList.add('active');}
      }
    }catch(e){}
  }

  window.zevaniOpenLogin=openLogin;
  window.zevaniCloseLogin=closeLogin;

  function wireFrame(){
    let d,w;
    try{d=frame.contentDocument;w=frame.contentWindow;}catch(e){return;}
    if(!d||!d.body||!w)return;

    w.showAuth=function(mode){
      if(mode==='login') openLogin();
      else if(typeof w.toggleAuthMode==='function') w.toggleAuthMode();
      else openLogin();
    };

    d.addEventListener('click',function(ev){
      let el=ev.target;
      while(el && el!==d.body && el.tagName!=='BUTTON' && el.tagName!=='A') el=el.parentElement;
      if(!el)return;
      const text=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(/^log\s*in$/i.test(text) || /^log\s*in\s*to/i.test(text)){
        ev.preventDefault();
        ev.stopPropagation();
        ev.stopImmediatePropagation();
        openLogin();
      }
    },true);
  }

  frame.addEventListener('load',function(){
    wireFrame();
    setTimeout(wireFrame,300);
    setTimeout(wireFrame,1000);
  });

  back.addEventListener('click',closeLogin);
  modal.addEventListener('click',function(e){if(e.target===modal)closeLogin();});

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    error.style.display='none';
    submit.disabled=true;
    submit.textContent='Logging in…';
    try{
      const result=await supabaseClient.auth.signInWithPassword({
        email:email.value.trim(),
        password:password.value
      });
      if(result.error) throw result.error;
      const user=result.data && result.data.user;
      if(user){
        localStorage.setItem('zevaniUserEmail',user.email||'');
        localStorage.setItem('zevaniUserName',(user.user_metadata&&user.user_metadata.name)||((user.email||'').split('@')[0]));
      }
      closeLogin();
      setTimeout(goToDashboard,100);
    }catch(err){
      error.textContent=err && err.message ? err.message : 'Login failed. Please check your email and password.';
      error.style.display='block';
    }finally{
      submit.disabled=false;
      submit.textContent='Log In';
    }
  });
})();
</script>
</body>
</html>
