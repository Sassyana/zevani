<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f4ed;color:#101a2d;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
#loading{padding:30px;text-align:center}
</style>
</head>
<body>
<div id="loading">Opening ZEVANI…</div>
<script>
(function(){
  var rebuild=/^zevani-rebuild(?:-.*)?\.vercel\.app$/i.test(location.hostname);
  if(!rebuild){
    location.replace('index-current.html');
    return;
  }
  var source='https://raw.githubusercontent.com/Sassyana/zevani/zevani-rebuild-test/index-rebuild.html';
  fetch(source,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Rebuild unavailable');return r.text();})
    .then(function(html){
      var extra=`
<style id="zevani-choice-style">
#zevaniChoiceOverlay{position:fixed;inset:0;z-index:10000;background:rgba(8,13,23,.78);display:none;align-items:center;justify-content:center;padding:22px;box-sizing:border-box}
#zevaniChoiceOverlay.open{display:flex}
.zevani-choice-card{width:min(760px,100%);background:#fff;border-radius:30px;padding:38px;box-shadow:0 25px 90px rgba(0,0,0,.28);text-align:center;color:#202633}
.zevani-choice-card .kicker{color:#9a7d4b;text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:800}
.zevani-choice-card h2{font:normal 42px Georgia,serif;color:#101a2d;margin:12px 0}
.zevani-choice-card p{color:#707887;line-height:1.65;max-width:580px;margin:0 auto 25px}
.zevani-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
.zevani-choice{border:1px solid #e5dfd4;background:#fff;border-radius:22px;padding:24px;cursor:pointer;transition:.2s}
.zevani-choice:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(16,26,45,.12);border-color:#c7a86b}
.zevani-choice strong{display:block;color:#101a2d;font-size:19px;margin-bottom:8px}
.zevani-choice span{display:block;color:#707887;font-size:14px;line-height:1.5}
.zevani-choice .arrow{display:block;color:#9a7d4b;font-weight:800;margin-top:16px}
.zevani-choice-close{margin-top:20px;border:0;background:none;color:#707887;cursor:pointer;font-weight:700}
@media(max-width:600px){.zevani-choice-card{padding:25px}.zevani-choice-card h2{font-size:34px}.zevani-choice-grid{grid-template-columns:1fr}}
</style>
<div id="zevaniChoiceOverlay" aria-hidden="true">
  <div class="zevani-choice-card" role="dialog" aria-modal="true" aria-labelledby="zevaniChoiceTitle">
    <div class="kicker">YOUR COMPANION</div>
    <h2>How would you like to begin?</h2>
    <p>Choose someone from the ZEVANI Companion Library, or create a completely original companion designed around you.</p>
    <div class="zevani-choice-grid">
      <button class="zevani-choice" type="button" onclick="zevaniChooseExisting()">
        <strong>Choose an Existing Companion</strong>
        <span>Browse the ready-made companions, meet them, and choose the one who feels right.</span>
        <span class="arrow">Browse the library →</span>
      </button>
      <button class="zevani-choice" type="button" onclick="zevaniCreateCustom()">
        <strong>Create Your Own</strong>
        <span>Build your companion's identity, personality, relationship style, backstory and portrait.</span>
        <span class="arrow">Start creating →</span>
      </button>
    </div>
    <button class="zevani-choice-close" type="button" onclick="zevaniCloseChoice()">Cancel</button>
  </div>
</div>`;
      html=html.replace('</body>',extra+'</body>');
      document.open();document.write(html);document.close();
      setTimeout(function(){
        var original=window.showBuilder;
        if(typeof original!=='function')return;
        window._zevaniOriginalShowBuilder=original;
        window.showBuilder=function(){
          var o=document.getElementById('zevaniChoiceOverlay');
          if(o){o.classList.add('open');o.setAttribute('aria-hidden','false');}
        };
        window.zevaniCloseChoice=function(){
          var o=document.getElementById('zevaniChoiceOverlay');
          if(o){o.classList.remove('open');o.setAttribute('aria-hidden','true');}
        };
        window.zevaniChooseExisting=function(){
          window.zevaniCloseChoice();
          if(typeof window.showHome==='function')window.showHome();
          setTimeout(function(){
            var lib=document.getElementById('library');
            if(lib)lib.scrollIntoView({behavior:'smooth',block:'start'});
          },50);
        };
        window.zevaniCreateCustom=function(){
          window.zevaniCloseChoice();
          if(typeof window._zevaniOriginalShowBuilder==='function')window._zevaniOriginalShowBuilder();
        };
      },0);
    })
    .catch(function(err){document.getElementById('loading').textContent='The ZEVANI rebuild is temporarily unavailable. Please refresh.';console.error(err);});
})();
</script>
</body>
</html>
