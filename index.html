<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}
#zevaniApp{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f7f4ed}
</style>
</head>
<body>
<iframe id="zevaniApp" src="index-current.html" title="ZEVANI" allow="clipboard-write"></iframe>
<script>
(function(){
  const frame=document.getElementById('zevaniApp');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.body)return;

      // Clean the escaped characters from the older file.
      const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
      const nodes=[];let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(x=>{
        if(x.nodeValue)x.nodeValue=x.nodeValue.replace(/\\n/g,'').replace(/\\/g,'');
      });

      // The dashboard is a private area. It must never appear on the public homepage.
      const style=doc.createElement('style');
      style.id='zevani-private-dashboard-fix';
      style.textContent=`
        #zevaniDashboard{display:none!important}
        #zevaniDashboard.active{display:none!important}
        .dashboard-section{display:none!important}
        .auth-section{box-sizing:border-box;min-height:100vh!important;padding:120px 20px 60px!important;display:flex!important;align-items:center!important;justify-content:center!important}
        .auth-card{box-sizing:border-box;width:min(520px,100%)!important;padding:42px!important}
        .auth-input{box-sizing:border-box!important;width:100%!important;display:block!important}
        #authPasswordConfirm{display:none}
        @media(max-width:700px){
          .nav-links{gap:10px!important}
          .nav-links a{display:none}
          .auth-card{padding:28px 20px!important;border-radius:24px!important}
          .auth-card h2{font-size:36px!important}
        }
      `;
      doc.head.appendChild(style);
    }catch(e){console.warn('ZEVANI page cleanup:',e)}
  });
})();
</script>
</body>
</html>
