<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed;font-family:Arial,Helvetica,sans-serif;color:#202633}
#zevaniApp{display:block;width:100%;height:100%;border:0}
#zevaniLoginModal,#zevaniDashboardOverlay{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:rgba(16,26,45,.72);padding:20px;box-sizing:border-box}
#zevaniLoginModal.show,#zevaniDashboardOverlay.show{display:flex}
.z-card{width:min(520px,100%);background:#fff;border-radius:30px;padding:40px;box-shadow:0 30px 90px rgba(0,0,0,.3);box-sizing:border-box}
.z-label{color:#c7a86b;text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:bold}
.z-card h1,.z-card h2{font-family:Georgia,serif;font-weight:normal;color:#101a2d;margin:12px 0}
.z-card h2{font-size:42px}.z-card h1{font-size:44px}
.z-card p{color:#707887;line-height:1.6}
.z-input{width:100%;padding:16px;border:1px solid #e4dfd5;border-radius:14px;font-size:15px;box-sizing:border-box;margin-bottom:12px;outline:none}.z-input:focus{border-color:#c7a86b}
.z-error{display:none;background:#fff0ef;color:#a94442;padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px}
.z-primary,.z-secondary{width:100%;padding:15px 20px;border-radius:30px;font-weight:bold;font-size:15px;cursor:pointer}
.z-primary{border:0;background:#101a2d;color:#fff}.z-secondary{margin-top:12px;background:#fff;border:1px solid #c9c3b6;color:#101a2d}
.z-account{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px;padding:15px 18px;background:#f7f4ed;border-radius:18px}.z-account strong{color:#101a2d}.z-account span{color:#707887;font-size:13px}
.z-logout{border:1px solid #c9c3b6;background:#fff;color:#101a2d;padding:10px 16px;border-radius:22px;font-weight:bold;cursor:pointer;white-space:nowrap}
.z-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.z-action{border:1px solid #e4dfd5;background:#fff;border-radius:18px;padding:18px;text-align:left;color:#101a2d;font-weight:bold;cursor:pointer}.z-action span{display:block;color:#707887;font-size:12px;font-weight:normal;margin-top:5px}
@media(max-width:600px){.z-card{padding:28px 20px}.z-actions{grid-template-columns:1fr}.z-account{align-items:flex-start;flex-direction:column}.z-logout{width:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<iframe id="zevaniApp" src="index-current.html" title="ZEVANI"></iframe>

<div id="zevaniLoginModal" aria-hidden="true">
<div class="z-card">
<div class="z-label">ZEVANI</div><h2>Welcome back.</h2><p>Log in to continue to your ZEVANI account.</p>
<div id="zLoginError" class="z-error"></div>
<form id="zLoginForm">
<input id="zLoginEmail" class="z-input" type="email" autocomplete="email" placeholder="Email address" required>
<input id="zLoginPassword" class="z-input" type="password" autocomplete="current-password" placeholder="Password" required>
<button id="zLoginSubmit" class="z-primary" type="submit">Log In</button>
</form>
<button id="zLoginBack" class="z-secondary" type="button">← Back</button>
</div></div>

<div id="zevaniDashboardOverlay" aria-hidden="true">
<div class="z-card">
<div class="z-label">YOUR ZEVANI SPACE</div>
<h1 id="zWelcomeName">Welcome back, Ana.</h1>
<p>Your ZEVANI account is ready. This is your private companion space.</p>
<div class="z-account"><div><strong id="zAccountName">Ana</strong><br><span id="zAccountEmail"></span></div><button id="zLogout" class="z-logout" type="button">Log Out</button></div>
<div class="z-actions">
<button class="z-action" id="zChat" type="button">💬 Continue chatting<span>Return to your companion.</span></button>
<button class="z-action" id="zManage" type="button">✨ Manage companion<span>Customize your companion.</span></button>
<button class="z-action" id="zProfile" type="button">👤 My profile<span>View your companion profile.</span></button>
<button class="z-action" id="zCloseDash" type="button">← Back to ZEVANI<span>Return to the main site.</span></button>
</div>
</div></div>

<script>
(function(){
const URL='https://hfdembdqzsedjbgemtdp.supabase.co';
const KEY='sb_publishable_NZAxQrtZ-sssoeIGVySf3w_1c0Io_xu';
const sb=window.supabase.createClient(URL,KEY);
const frame=document.getElementById('zevaniApp');
const login=document.getElementById('zevaniLoginModal');
const dash=document.getElementById('zevaniDashboardOverlay');
const email=document.getElementById('zLoginEmail');
const password=document.getElementById('zLoginPassword');
const error=document.getElementById('zLoginError');
const submit=document.getElementById('zLoginSubmit');
let user=null;
function nameOf(u){return (u&&u.user_metadata&&u.user_metadata.name)||((u&&u.email)||'').split('@')[0]||'Ana'}
function openLogin(){error.style.display='none';error.textContent='';login.classList.add('show');login.setAttribute('aria-hidden','false');setTimeout(()=>email.focus(),50)}
function closeLogin(){login.classList.remove('show');login.setAttribute('aria-hidden','true')}
function showDashboard(u){user=u||user;if(!user)return;const n=nameOf(user);document.getElementById('zWelcomeName').textContent='Welcome back, '+n+'.';document.getElementById('zAccountName').textContent=n;document.getElementById('zAccountEmail').textContent=user.email||'';dash.classList.add('show');dash.setAttribute('aria-hidden','false')}
function closeDashboard(){dash.classList.remove('show');dash.setAttribute('aria-hidden','true')}
function resetToHome(){closeDashboard();try{const w=frame.contentWindow;if(w&&typeof w.showHome==='function')w.showHome();}catch(e){}}
function wireFrame(){let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(e){return}if(!d||!d.body)return;d.addEventListener('click',function(ev){let el=ev.target;while(el&&el!==d.body&&el.tagName!=='BUTTON'&&el.tagName!=='A')el=el.parentElement;if(!el)return;const text=(el.textContent||'').replace(/\s+/g,' ').trim();if(/^log\s*in$/i.test(text)||/^log\s*in\s*to/i.test(text)){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();openLogin()}},true)}
frame.addEventListener('load',()=>{wireFrame();setTimeout(wireFrame,300);setTimeout(wireFrame,1000)});
document.getElementById('zLoginBack').onclick=closeLogin;
login.addEventListener('click',e=>{if(e.target===login)closeLogin()});
document.getElementById('zCloseDash').onclick=resetToHome;
document.getElementById('zChat').onclick=()=>{closeDashboard();try{frame.contentWindow.openChat()}catch(e){}};
document.getElementById('zManage').onclick=()=>{closeDashboard();try{frame.contentWindow.startBuilder()}catch(e){}};
document.getElementById('zProfile').onclick=()=>{closeDashboard();try{frame.contentWindow.generateCompanion()}catch(e){}};
document.getElementById('zLogout').onclick=async()=>{await sb.auth.signOut();user=null;localStorage.removeItem('zevaniUserEmail');localStorage.removeItem('zevaniUserName');closeDashboard();try{frame.contentWindow.showHome()}catch(e){}};
document.getElementById('zLoginForm').addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';submit.disabled=true;submit.textContent='Logging in…';try{const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)throw r.error;user=r.data.user;localStorage.setItem('zevaniUserEmail',user.email||'');localStorage.setItem('zevaniUserName',nameOf(user));closeLogin();setTimeout(()=>showDashboard(user),100)}catch(err){error.textContent=err.message||'Login failed. Please check your email and password.';error.style.display='block'}finally{submit.disabled=false;submit.textContent='Log In'}});
sb.auth.getSession().then(({data})=>{user=data.session&&data.session.user;if(user)localStorage.setItem('zevaniUserName',nameOf(user))});
sb.auth.onAuthStateChange((_event,session)=>{user=session&&session.user});
window.zevaniOpenLogin=openLogin;window.zevaniCloseLogin=closeLogin;window.zevaniShowDashboard=showDashboard;
})();
</script>
</body></html>
