<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}
#zevaniApp{display:block;width:100%;height:100%;border:0}
#zevaniFixStatus{position:fixed;right:12px;bottom:12px;z-index:99999;font:11px Arial,sans-serif;color:#707887;background:rgba(255,255,255,.9);padding:6px 9px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);display:none}
</style>
</head>
<body>
<iframe id="zevaniApp" src="index-current.html" title="ZEVANI"></iframe>
<div id="zevaniFixStatus">ZEVANI ready</div>
<script>
(function(){
  const frame=document.getElementById('zevaniApp');

  function installFixes(){
    let w,d;
    try{ w=frame.contentWindow; d=frame.contentDocument; }catch(e){ return; }
    if(!w||!d||!d.body) return;

    function hidePages(){
      ['homePage','betaPage','builderPage','profilePage','chatPage'].forEach(id=>{
        const el=d.getElementById(id); if(el) el.classList.add('hidden');
      });
    }

    w.openProfile=function(){
      hidePages();
      const el=d.getElementById('profilePage');
      if(el) el.classList.remove('hidden');
      w.scrollTo(0,0);
    };

    w.openBuilder=function(){
      if(typeof w.startBuilder==='function') w.startBuilder();
      else {
        hidePages();
        const el=d.getElementById('builderPage');
        if(el) el.classList.remove('hidden');
      }
    };

    w.openDashboard=function(){
      hidePages();
      const dash=d.getElementById('zevaniDashboard');
      if(!dash) return;
      dash.classList.add('active');

      try{
        if(w.companion){
          const name=w.companion.name||'Alex';
          const type=w.companion.type||'Romantic';
          const nameEl=d.getElementById('zdashName');
          const typeEl=d.getElementById('zdashType');
          const avatarEl=d.getElementById('zdashAvatar');
          if(nameEl) nameEl.textContent=name;
          if(typeEl) typeEl.textContent=type;
          if(avatarEl) avatarEl.textContent=name.charAt(0).toUpperCase();
        }
      }catch(e){}
      w.scrollTo(0,0);
    };

    w.closeZevaniDashboard=function(){
      const dash=d.getElementById('zevaniDashboard');
      if(dash) dash.classList.remove('active');
      if(typeof w.showHome==='function') w.showHome();
      else {
        const home=d.getElementById('homePage');
        if(home) home.classList.remove('hidden');
      }
    };

    const dashBtn=d.getElementById('zevaniDashboardButton');
    if(dashBtn && !dashBtn.dataset.zevaniFixed){
      dashBtn.dataset.zevaniFixed='1';
      dashBtn.addEventListener('click',w.openDashboard);
    }

    const dash=d.getElementById('zevaniDashboard');
    if(dash) dash.classList.remove('active');

    const status=document.getElementById('zevaniFixStatus');
    if(status){status.style.display='none';}
  }

  frame.addEventListener('load',function(){
    installFixes();
    setTimeout(installFixes,300);
    setTimeout(installFixes,1000);
  });
})();
</script>
</body>
</html>
