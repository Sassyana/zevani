<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}
#zevaniApp{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block;background:#f7f4ed}
</style>
</head>
<body>
<iframe id="zevaniApp" src="index-current.html" title="ZEVANI" allow="clipboard-write"></iframe>
<script>
(function(){
  const frame=document.getElementById('zevaniApp');

  function cleanDocument(doc){
    if(!doc || !doc.body) return;

    // The current ZEVANI page contains a few literal backslash/newline
    // characters from an earlier edit. Remove them from visible text only.
    const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
    const nodes=[];
    let node;
    while(node=walker.nextNode()) nodes.push(node);
    nodes.forEach(n=>{
      if(n.nodeValue && (n.nodeValue.indexOf('\\n')!==-1 || n.nodeValue.indexOf('\\\\')!==-1)){
        n.nodeValue=n.nodeValue.replace(/\\n/g,'').replace(/\\/g,'');
      }
    });

    const style=doc.createElement('style');
    style.id='zevani-index-cleanup';
    style.textContent=`
      .auth-section{box-sizing:border-box;min-height:100vh!important;padding:120px 20px 60px!important;display:flex!important;align-items:center!important;justify-content:center!important}
      .auth-card{box-sizing:border-box;width:min(520px,100%)!important;padding:42px!important}
      .auth-card form{display:block!important}
      .auth-input{box-sizing:border-box!important;width:100%!important;display:block!important}
      .auth-switch{margin-top:22px!important;text-align:center!important}
      .auth-switch button{display:inline!important;width:auto!important}
      #guestAuthButtons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      #accountBar{align-items:center;gap:8px}
      @media(max-width:700px){
        .nav-links{gap:10px!important}
        .nav-links a{display:none}
        .auth-card{padding:28px 20px!important;border-radius:24px!important}
        .auth-card h2{font-size:36px!important}
      }
    `;
    doc.head.appendChild(style);
  }

  frame.addEventListener('load',function(){
    try{cleanDocument(frame.contentDocument);}catch(e){console.warn('ZEVANI cleanup:',e)}
  });
})();
</script>
</body>
</html>
