<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVANI — Personalized AI Companionship</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f4ed;color:#101a2d;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
#loading{padding:30px;text-align:center}
</style>
</head>
<body>
<div id="loading">Opening ZEVANI…</div>
<script>
(function(){
  var rebuild=/^zevani-rebuild(?:-.*)?\.vercel\.app$/i.test(location.hostname);
  if(!rebuild){
    location.replace('index-current.html');
    return;
  }
  var source='https://raw.githubusercontent.com/Sassyana/zevani/zevani-rebuild-test/index-rebuild.html';
  fetch(source,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Rebuild unavailable');return r.text();})
    .then(function(html){document.open();document.write(html);document.close();})
    .catch(function(err){document.getElementById('loading').textContent='The ZEVANI rebuild is temporarily unavailable. Please refresh.';console.error(err);});
})();
</script>
</body>
</html>
