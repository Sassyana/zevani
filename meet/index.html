<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVANI — Meet Your Companion</title><style>:root{--n:#101a2d;--c:#f7f4ed;--g:#c7a86b;--l:#e4dfd5}*{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:#202633;font:16px Arial}.nav{height:70px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 6%;gap:18px}.brand{font-size:23px;font-weight:800;letter-spacing:5px;color:var(--n);margin-right:auto;cursor:pointer}.brand span{color:var(--g)}.nav button{border:1px solid #c9c3b6;background:#fff;color:var(--n);padding:9px 15px;border-radius:24px;font-weight:bold;cursor:pointer}.wrap{min-height:calc(100vh - 70px);display:flex;justify-content:center;padding:25px}.chat{width:min(760px,100%);height:calc(100vh - 120px);min-height:560px;background:var(--c);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px #0002}.head{background:#fff;padding:18px 22px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #eee}.face{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#d7c7a8;flex:none}.face img{width:100%;height:100%;object-fit:cover}.info h1{font:normal 28px Georgia,serif;color:var(--n);margin:0}.status{font-size:11px;color:#4f9561;margin-top:4px}.messages{flex:1;overflow:auto;padding:25px}.bubble{max-width:78%;padding:13px 16px;border-radius:19px;line-height:1.55;margin-bottom:11px;background:#fff}.bubble.user{margin-left:auto;background:var(--n);color:#fff}.typing{opacity:.6;font-style:italic}.form{display:flex;gap:9px;background:#fff;padding:12px}.form input{flex:1;border:1px solid var(--l);border-radius:25px;padding:13px}.send{border:0;border-radius:50%;width:46px;background:var(--n);color:#fff;font-weight:bold;cursor:pointer}.empty{padding:60px;text-align:center}.empty h1{font:normal 42px Georgia,serif;color:var(--n);margin-bottom:10px}.empty button{border:0;border-radius:22px;padding:12px 18px;background:var(--n);color:#fff;cursor:pointer}.hidden{display:none!important}@media(max-width:600px){.nav{padding:0 15px}.wrap{padding:10px}.chat{height:calc(100vh - 90px);min-height:0;border-radius:20px}.messages{padding:18px}}</style></head><body><nav class="nav"><div class="brand" id="home">ZEVANI<span>•</span></div><button id="back">← Back</button></nav><div class="wrap"><div id="empty" class="empty hidden"><h1>Companion not found</h1><p>Choose a companion again from the library.</p><button id="emptyBack">Back to Library</button></div><div id="chat" class="chat hidden"><div class="head"><div class="face"><img id="photo" alt=""></div><div class="info"><h1 id="name"></h1><div class="status">● Ready to talk</div></div></div><div id="messages" class="messages"></div><form id="form" class="form"><input id="input" autocomplete="off" placeholder="Message your companion…"><button class="send" type="submit">➤</button></form></div></div><script>const LIBRARY='../rebuild/';const HOME='../';let companion=null;try{const raw=localStorage.getItem('zevaniPendingCompanion');if(raw)companion=JSON.parse(raw)}catch(e){console.error(e)}const $=id=>document.getElementById(id);function goHome(){location.href=HOME}function goLibrary(){location.href=LIBRARY}function goBack(){if(history.length>1)history.back();else goLibrary()}$('home').onclick=goHome;$('back').onclick=goBack;$('emptyBack').onclick=goLibrary;if(!companion){$('empty').classList.remove('hidden')}else{$('chat').classList.remove('hidden');$('name').textContent=companion.name;$('photo').src=companion.image||'';const id=companion.id||('library-'+companion.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'));const key='zevaniChat_'+id;let historyData=[];try{historyData=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(historyData.slice(-100)))}function add(text,user=false){const d=document.createElement('div');d.className='bubble'+(user?' user':'');d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}if(historyData.length){historyData.forEach(m=>add(m.content,m.role==='user'))}else{historyData=[{role:'assistant',content:companion.story||('Hi. I am '+companion.name+'. I am here to meet you.')}];save();add(historyData[0].content)}const saved=JSON.parse(localStorage.getItem('zevaniCompanions')||'[]');const item={id,name:companion.name,type:companion.category||companion.type||'Companion',personality:companion.personality||'warm, attentive and supportive',voice:companion.voice||'',image:companion.image||'',source:companion.source||'library',story:companion.story||''};localStorage.setItem('zevaniCompanions',JSON.stringify([...saved.filter(c=>c.id!==id),item]));async function send(message){historyData.push({role:'user',content:message});save();add(message,true);const t=document.createElement('div');t.className='bubble typing';t.textContent='Thinking…';$('messages').appendChild(t);$('messages').scrollTop=$('messages').scrollHeight;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:historyData.slice(-20),companion:{name:companion.name,type:companion.category||companion.type||'Companion',personality:companion.personality||'warm, attentive and supportive',appearance:'as shown in the companion profile',memories:[]},safetyIdentifier:'zevani-library-'+id})});const data=await r.json();if(!r.ok)throw new Error(data.error||'AI request failed');t.remove();historyData.push({role:'assistant',content:data.reply});save();add(data.reply)}catch(e){t.remove();add('I could not reach the AI right now. Please try again.');console.error(e)}}$('form').onsubmit=e=>{e.preventDefault();const v=$('input').value.trim();if(!v)return;$('input').value='';send(v)}}}</script></body></html>
